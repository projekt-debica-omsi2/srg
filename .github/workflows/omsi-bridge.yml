name: Build OMSI test bridge
on:
  push:
    paths: ['omsi-bridge/**', '.github/workflows/omsi-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Compile x86 OMSI DLL
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          call omsi-bridge\build.cmd
      - name: Test DLL and bridge
        working-directory: omsi-bridge
        run: |
          python tests/smoke_dll.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build companion executable
        working-directory: omsi-bridge
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --onefile --name SRG-OMSI-Bridge bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/SRG-OMSI-Bridge.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: SRG-OMSI-Bridge-0.1-test
          path: |
            omsi-bridge/plugins/*.dll
            omsi-bridge/plugins/*.opl
            omsi-bridge/SRG-OMSI-Bridge.exe
            omsi-bridge/USB.cmd
            omsi-bridge/README-PL.md
          if-no-files-found: error
