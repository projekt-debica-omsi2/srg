name: Build OMSI test bridge
on:
  push:
    paths: ['omsi-bridge/**', 'omsi-pc/**', 'tools/package_omsi_pc.py', '.github/workflows/omsi-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Compile x86 OMSI DLL
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          call omsi-bridge\build.cmd
      - name: Test DLL and bridge
        working-directory: omsi-bridge
        run: |
          python tests/smoke_dll.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build companion executable
        working-directory: omsi-bridge
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --onefile --name SRG-OMSI-Bridge bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/SRG-OMSI-Bridge.exe .
      - name: Test portable Windows configuration without running the game
        shell: powershell
        run: .\omsi-pc\tests\test-common.ps1
      - name: Package portable computer setup
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/projekt-debica-omsi2/srg/releases/download/v1.4.86/openOMSI-SRG-kamery.zip' -OutFile camera-engine.zip
          python tools/package_omsi_pc.py --bridge omsi-bridge --engine camera-engine.zip --output SRG-OMSI-PC-0.8-Windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SRG-OMSI-PC-0.8-Windows-x64
          path: |
            SRG-OMSI-PC-0.8-Windows-x64.zip
            SRG-OMSI-PC-0.8-Windows-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SRG-OMSI-Bridge-0.8
          path: |
            omsi-bridge/plugins/*.dll
            omsi-bridge/plugins/*.opl
            omsi-bridge/plugins/*.lua
            omsi-bridge/SRG-OMSI-Bridge.exe
            omsi-bridge/USB.cmd
            omsi-bridge/README-PL.md
          if-no-files-found: error
