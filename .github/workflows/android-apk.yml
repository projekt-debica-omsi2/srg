name: Build SRG Mobile GPS APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test auto GPS stop switching
        run: node tests/test-auto-gps.cjs
      - name: Test arrival and departure announcements
        run: node tests/test-voice-gps.cjs
      - name: Test LCD and RJ audio mapping
        run: node tests/test-lcd-and-rj.cjs
      - name: Test separate NZ audio announcements
        run: node tests/test-nz-audio.cjs
      - name: Test photographed S-25 and S-27 timetables
        run: node tests/test-photo-timetables.cjs
      - name: Verify 79 embedded Marek Neural recordings
        # Nagrane MP3 dołączone w repo; test SHA256 chroni komplet przed pomyłkami.
        run: node tests/test-marek-generated.cjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRG-Mobile-v1.4.26-MAREK79-S25-S27-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
