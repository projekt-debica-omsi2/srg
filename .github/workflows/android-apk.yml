name: Build SRG Mobile 1.4.66 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'gradle.properties'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test auto GPS stop switching
        run: node tests/test-auto-gps.cjs
      - name: Test arrival and departure announcements
        run: node tests/test-voice-gps.cjs
      - name: Test LCD and RJ audio mapping
        run: node tests/test-lcd-and-rj.cjs
      - name: Test separate NZ audio announcements
        run: node tests/test-nz-audio.cjs
      - name: Test photographed S-25 and S-27 timetables
        run: node tests/test-photo-timetables.cjs
      - name: Verify 79 embedded Marek Neural recordings
        # Nagrane MP3 dołączone w repo; test SHA256 chroni komplet przed pomyłkami.
        run: node tests/test-marek-generated.cjs
      - name: Test combined timetables and LCD
        run: |
          node tests/test-v1429.cjs
          node tests/test-lcd-merged.cjs
          node tests/test-lcd-cycle.cjs
          node tests/test-manual-lcd.cjs
          node tests/test-s27-1045.cjs
          node tests/test-transfers.cjs
          node tests/test-pks-transfers.cjs
          node tests/test-rzeszow-rail.cjs
          node tests/test-weekend-hubs.cjs
          node tests/test-timetable-cache.cjs
          node tests/test-mks-debica.cjs
          node tests/test-mks-network.cjs
          node tests/test-train-transfers.cjs
          node tests/test-road-progress.cjs
          node tests/test-schedule-deviation.cjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test R&G frame templates
        run: node tests/test-rg-usb.cjs
      - name: Test additional lines, LCD scrolling and IBIS
        run: node tests/test-v1464.cjs
      - name: Test Ropczyce photo timetable
        run: node tests/test-ropczyce.cjs
      - name: Test automatic phone and tablet layouts
        run: node tests/test-phone-layout.cjs
      - name: Test signing publication guards
        run: python3 -m unittest discover -s tests -p test_signing.py
      - name: Restore permanent signing key
        env:
          SRG_KEYSTORE_BASE64: ${{ secrets.SRG_KEYSTORE_BASE64 }}
          SRG_KEYSTORE_PASSWORD: ${{ secrets.SRG_KEYSTORE_PASSWORD }}
          SRG_SIGNING_CERT_SHA256: ${{ secrets.SRG_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PYCODE'
          import os, base64, pathlib, sys
          names=['SRG_KEYSTORE_BASE64','SRG_KEYSTORE_PASSWORD','SRG_SIGNING_CERT_SHA256']
          if any(not os.environ.get(n) for n in names):
              sys.exit('Brak stałego podpisu: uruchom tools/setup_signing.py. Nie publikuję APK z przypadkowym kluczem.')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'srg-release.p12'
          path.write_bytes(base64.b64decode(os.environ['SRG_KEYSTORE_BASE64'],validate=True))
          path.chmod(0o600)
          PYCODE
      - name: Build signed APK
        env:
          SRG_KEYSTORE_PATH: ${{ runner.temp }}/srg-release.p12
          SRG_KEYSTORE_PASSWORD: ${{ secrets.SRG_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signature and package
        env:
          SRG_SIGNING_CERT_SHA256: ${{ secrets.SRG_SIGNING_CERT_SHA256 }}
        run: python3 tools/verify_release.py
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/srg-release.p12"
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRG-Mobile-v1.4.66-KURSOWKI-LCD-LAN-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
