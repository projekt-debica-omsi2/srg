<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRG — zarządzanie pojazdami</title><link rel="stylesheet" href="leaflet.css"><style>body{margin:0;background:#0b1711;color:#eee;font:16px Arial}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,button{padding:10px;font:inherit}#map{height:75vh;background:#12271b}.busLabel{width:230px!important;margin-left:-115px!important;text-align:center;white-space:nowrap;font-weight:bold;line-height:1.4}.busLabel span{display:block;background:#101d16e8;border-radius:3px;color:white;padding:1px 6px}.busLabel .bus{font-size:30px;background:transparent;filter:drop-shadow(0 0 3px #000)}.busLabel .delay{color:#91efb0}.busLabel.offline{opacity:.55}.leaflet-popup{color:#12221a}#details{padding:12px;white-space:pre-line}#login{padding:20px}#status{padding:6px}.hidden{display:none}.placeLabel{color:#cfe8d9;font:12px Arial;text-align:center;text-shadow:0 1px 3px #000,1px 0 3px #000;white-space:nowrap}</style><header><a href="SRGMobile-TestGPS-1.4.92.apk" style="color:#9fe9bc">Nowy APK 1.4.92 — wyłącznik GPS</a><button id="mapSatellite" type="button">Satelita: wył.</button><span id="mapNotice" role="status"></span><button id="mapAll" type="button">Cały obszar</button><button id="mapRzeszow" type="button">Rzeszów</button><button id="refreshNow" type="button">Odśwież teraz</button><a href="SRGMobile-TestGPS.apk" style="color:#9fe9bc">Poprzedni APK 1.4.91</a><b>SRG — mapa pojazdów</b><span id="role"></span><span id="status">Ładowanie…</span><small>Niebieski: GPS online · Czerwony: symulacja offline · odświeżanie co 55 s</small></header><section id="panel"><div id="waiting" style="padding:10px;display:flex;gap:12px;flex-wrap:wrap"></div><div id="map"></div><div id="details">Kliknij autobus, aby zobaczyć trasę i następny przystanek.</div></section><script src="leaflet.js"></script><script src="offline-roads.js"></script><script>
const $=id=>document.getElementById(id);let map,markers,roads,routeLayer,selected=null,role='',satellite=null;const fmt=v=>new Date(v*1000).toLocaleString('pl-PL');function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function request(url,data){const r=await fetch(new URL(url.replace(/^\//,''),new URL('./',location.href)),{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function init(){if(map)return;map=L.map('map',{preferCanvas:true}).setView([50.03,21.4],12);map.attributionControl.setPrefix(false);map.attributionControl.addAttribution('© OpenStreetMap contributors · ODbL 1.0');roads=L.layerGroup().addTo(map);markers=L.layerGroup().addTo(map);routeLayer=L.layerGroup().addTo(map);map.on('moveend zoomend',draw);draw()}
function draw(){if(!map)return;roads.clearLayers();const b=map.getBounds().pad(.1),z=map.getZoom(),groups={};for(const [k,,p] of SRGOfflineMap.roads){if(z<12&&!['primary','secondary','tertiary','trunk'].includes(k))continue;if(z<14&&['service','path','footway','track'].includes(k))continue;if(p.some(q=>b.contains(q)))(groups[k]||=[]).push(p)}for(const [k,p] of Object.entries(groups))L.polyline(p,{color:'#466453',weight:2,interactive:false}).addTo(roads);for(const q of SRGOfflineMap.places||[]){if(!b.contains([q[0],q[1]])||z<11&&q[3]==='village'||z<9)continue;const name=el('span',q[2]);L.marker([q[0],q[1]],{interactive:false,icon:L.divIcon({className:'placeLabel',html:name,iconSize:[160,20],iconAnchor:[80,10]})}).addTo(roads)}}
function simulated(v){const p=v.payload||{},points=(p.route||[]).filter(s=>Number.isFinite(s.plannedAt)&&Number.isFinite(s.lat)&&Number.isFinite(s.lon));if(points.length<2)return null;const d=String(p.delay||'').trim().match(/^([+-])(\d+):(\d\d)$/);const shift=d?(d[1]==='-'?-1:1)*(Number(d[2])*60+Number(d[3]))*1000:0;const t=Date.now()+shift;let a=points[0],b=points.at(-1);if(t<=a.plannedAt)return a;if(t>=b.plannedAt)return b;for(let i=1;i<points.length;i++)if(points[i].plannedAt>=t){a=points[i-1];b=points[i];break}const fraction=Math.max(0,Math.min(1,(t-a.plannedAt)/Math.max(1,b.plannedAt-a.plannedAt)));return {lat:a.lat+(b.lat-a.lat)*fraction,lon:a.lon+(b.lon-a.lon)*fraction}}function show(v){selected=v.number;routeLayer.clearLayers();const p=v.payload||{};$('details').replaceChildren(el('b',v.simulation?'SYMULACJA — '+p.duty+' / '+p.tripNo:'Pojazd '+v.number+' · '+(v.display||'')),el('p','Kursówka: '+(p.duty||((p.direction&&p.direction!=='Bez kursu')?'brak danych — zaktualizuj APK':'Brak aktywnego kursu'))+(p.tripNo!=null?' · kurs '+p.tripNo:'')+(p.departure?'\nGodziny: '+p.departure+(p.arrival?'–'+p.arrival:''):'')+(p.serviceCode?'\nOznaczenie: '+p.serviceCode:'')+'\nKierunek: '+(p.direction||'—')+'\nNastępny przystanek: '+(p.nextStop||'—')+'\nOdchyłka: '+(p.delay||'—')+'\nPrzystanki: '+(v.simulation?'według rozkładu (symulacja)':(v.stopMode||p.stopMode)==='auto'?'AUTO GPS':(v.stopMode||p.stopMode)==='manual'?'RĘCZNIE':'brak danych — starszy APK')+'\nGPS: '+(v.simulation?'brak — pozycja szacowana':v.gpsFresh?'aktualny':v.gpsSeen?'ostatnia znana pozycja':'czeka na pozycję')+(p.calendarNote?'\n'+p.calendarNote:'')+'\nStan: '+(v.simulation?'SYMULACJA ROZKŁADU — brak zgłoszonego sterownika':v.online?'online':'offline')+'\nOstatni sygnał: '+(v.lastSeen?fmt(v.lastSeen):'brak')));const points=(p.route||[]).filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon));if(points.length){const line=L.polyline(points.map(s=>[s.lat,s.lon]),{color:'#2ee862',weight:4,dashArray:'6 7'}).addTo(routeLayer);for(const s of points)L.circleMarker([s.lat,s.lon],{radius:4,color:'#fff',fillColor:'#1ad853',fillOpacity:1}).bindPopup(el('span',s.name||'Przystanek')).addTo(routeLayer);if(window.lastSelected!==v.number){map.fitBounds(line.getBounds(),{padding:[60,60],maxZoom:15});window.lastSelected=v.number}$('details').append(el('p','Przerywana linia pokazuje kolejność przystanków; dokładny przebieg nie został jeszcze zatwierdzony.'))}if(role==='admin'){const release=el('button','Zwolnij numer '+v.number);release.onclick=async()=>{if(confirm('Zwolnić rezerwację '+v.number+'? Sterownik utraci dostęp do tego numeru.')){await request('/api/release',{number:v.number});selected=null;await refresh()}};$('details').append(release)}}
let centered=false;async function refresh(){try{const d=await request('/api/vehicles');role=d.role;$('role').textContent='Mapa pojazdow';$('panel').classList.remove('hidden');init();markers.clearLayers();$('waiting').replaceChildren();for(const v of d.vehicles){const p=v.payload||{};const inCourse=!!(p.direction&&p.direction!=='Bez kursu');const point=v.online||v.simulation?p:(simulated(v)||(!inCourse&&Number.isFinite(p.lat)&&Number.isFinite(p.lon)?p:null));if(!point||!Number.isFinite(point.lat)||!Number.isFinite(point.lon)){const card=el('button','\uD83D\uDE8C '+v.number+(v.display?' · '+v.display:'')+' — czeka na GPS');card.onclick=()=>show(v);$('waiting').append(card);continue;}const label=document.createElement('div');if(inCourse)label.append(el('span',p.direction));if(v.online||!inCourse){label.append(el('span',v.number));if(v.display)label.append(el('span',v.display));}const icon=el('span','');icon.className='bus';const color=v.online?'#299cff':'#f13f45';icon.innerHTML='<svg width="48" height="42" viewBox="0 0 48 42"><rect x="6" y="3" width="36" height="30" rx="6" fill="'+color+'" stroke="white" stroke-width="2"/><rect x="11" y="8" width="26" height="12" rx="2" fill="#e7f5ff"/><circle cx="14" cy="28" r="3" fill="white"/><circle cx="34" cy="28" r="3" fill="white"/><rect x="10" y="33" width="7" height="6" rx="2" fill="'+color+'"/><rect x="31" y="33" width="7" height="6" rx="2" fill="'+color+'"/></svg>';label.append(icon);if(v.simulation){label.append(el('span','SYMULACJA · '+(p.duty||'—')+(p.tripNo!=null?' · kurs '+p.tripNo:'')));label.lastChild.style.color='#ff7979';}if(v.online&&inCourse){label.append(el('span',p.delay||'—'));label.lastChild.className='delay'}const m=L.marker([point.lat,point.lon],{icon:L.divIcon({className:'busLabel',html:label,iconSize:[230,100],iconAnchor:[115,65]})}).addTo(markers);m.on('click',()=>show(v));if(!centered){map.setView([point.lat,point.lon],13);centered=true}if(selected===v.number)show(v)}$('status').textContent=d.vehicles.filter(v=>!v.simulation).length+' sterowników · '+d.vehicles.filter(v=>v.online).length+' online · '+d.vehicles.filter(v=>v.simulation).length+' symulacji'+(d.vehicles.some(v=>!v.payload)?' | Bez pozycji GPS: '+d.vehicles.filter(v=>!v.payload).map(v=>v.number).join(', '):'');}catch(e){$('status').textContent=e.message}}
$('mapSatellite').onclick=()=>{if(satellite&&map.hasLayer(satellite)){map.removeLayer(satellite);$('mapSatellite').textContent='Satelita: wył.';$('mapNotice').textContent='';}else{if(!satellite){satellite=L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution',{layers:'Raster',format:'image/jpeg',version:'1.1.1',maxZoom:19,attribution:'Zdjęcia: Geoportal / GUGiK'});satellite.on('tileerror',()=>{$('mapNotice').textContent='Brak zdjęć — sprawdź internet';});satellite.on('load',()=>{$('mapNotice').textContent='';});}satellite.addTo(map);$('mapSatellite').textContent='Satelita: wł.';}};$('mapAll').onclick=()=>{const b=SRGOfflineMap.bbox;if(b)map.fitBounds([[b[1],b[0]],[b[3],b[2]]]);};$('mapRzeszow').onclick=()=>map.setView([50.0412,21.9991],11);$('refreshNow').onclick=()=>refresh();init();refresh();setInterval(refresh,55000);
</script></html>
