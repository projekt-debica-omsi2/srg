plugins { id 'com.android.application' }

android {
    namespace 'pl.srgmobile.classic'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.srgmobile.classic.lcd29standalone'
        minSdk 26
        targetSdk 34
        versionCode 11429
        versionName '1.4.29'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
