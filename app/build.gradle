plugins { id 'com.android.application' }
def publicEdition = providers.gradleProperty('srgPublic').getOrElse('false').toBoolean()

android {
    namespace 'pl.srgmobile.classic'
    compileSdk 35

    defaultConfig {
        applicationId publicEdition ? 'pl.srgmobile.publicapp' : 'pl.srgmobile.classic.lcd23'
        minSdk 26
        targetSdk 34
        versionCode 11488
        versionName '1.4.88'
        buildConfigField 'boolean', 'SRG_PUBLIC', publicEdition.toString()
        manifestPlaceholders = [appLabel: publicEdition ? 'SRGMobile Public' : 'SRGMobile']
    }
    buildFeatures { buildConfig true }
    if (publicEdition) {
        sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/publicAssets').get().asFile]
    }

    signingConfigs {
        stableRelease {
            def signingPath = System.getenv('SRG_KEYSTORE_PATH')
            if (signingPath) storeFile file(signingPath)
            storePassword System.getenv('SRG_KEYSTORE_PASSWORD')
            keyAlias 'srg'
            keyPassword System.getenv('SRG_KEYSTORE_PASSWORD')
            storeType 'PKCS12'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.stableRelease
            minifyEnabled false
        }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (publicEdition) {
    tasks.register('preparePublicAssets', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'tools/prepare_public.py', '--output', layout.buildDirectory.dir('generated/publicAssets').get().asFile.absolutePath
        inputs.dir 'src/main/assets'
        inputs.file rootProject.file('tools/prepare_public.py')
        outputs.dir layout.buildDirectory.dir('generated/publicAssets')
    }
    tasks.named('preBuild').configure { dependsOn 'preparePublicAssets' }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!System.getenv('SRG_KEYSTORE_PATH') || !System.getenv('SRG_KEYSTORE_PASSWORD')) {
            throw new GradleException('Brak stałego podpisu. Uruchom jednorazowo tools/setup_signing.py; nie zmieniaj istniejącego klucza.')
        }
    }
}
