plugins { id 'com.android.application' }

android {
    namespace 'pl.srgmobile.classic'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.srgmobile.classic.lcd23'
        minSdk 26
        targetSdk 34
        versionCode 11449
        versionName '1.4.49'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'com.github.mik3y:usb-serial-for-android:3.8.1' }
